worker_processes auto;

events {
  worker_connections 8192;
}

http {
  # Each request goes to the instance with the fewest open requests. Every instance can serve every route: tickets are
  # signed with a shared secret, state lives in Postgres and Redis, and one instance wins each admission tick.
  # An instance that crashed is started again by Docker (restart: unless-stopped) and may come back at a new address, so
  # the names are looked up again through Docker's DNS (`resolve`) instead of once at start.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream flash_be {
    zone flash_be 64k;
    least_conn;
    server flash-be-1:8080 resolve;
    server flash-be-2:8080 resolve;
    server flash-be-3:8080 resolve;
    keepalive 256;
  }

  # The same for both listeners below. Event streams must not be held back or cut after a minute of silence.
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 1h;

  # The public door, published to the host. Each server sets all three headers, because a server that sets one header
  # inherits none from above.
  server {
    listen 80;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The address of the caller as nginx sees it. Whatever the caller sent in X-Forwarded-For is replaced, so a client
    # cannot pick its own address for the rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;

    location / {
      proxy_pass http://flash_be;
    }
  }

  # The door of flash-web only. compose.prod.yaml does not publish this port, so only the containers of the stack reach
  # it. flash-web sets X-Forwarded-For to the address of the browser it serves and drops any the browser sent
  # (apps/flash-web/src/proxy.ts), so it is passed on as sent. Without it, every shopper on the page would share the
  # address of the flash-web container.
  server {
    listen 8081;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;

    location / {
      proxy_pass http://flash_be;
    }
  }
}
