worker_processes auto;

events {
  worker_connections 8192;
}

http {
  # Each request goes to the instance with the fewest open requests. Every instance can serve every route: tickets are
  # signed with a shared secret, state lives in Postgres and Redis, and one instance wins each admission tick.
  upstream flash_be {
    least_conn;
    server flash-be-1:8080;
    server flash-be-2:8080;
    server flash-be-3:8080;
    keepalive 256;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://flash_be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # The address of the caller as nginx sees it. Whatever the caller sent in X-Forwarded-For is replaced, so a client
      # cannot pick its own address for the rate limit. Behind flash-web, that address is the web server's.
      proxy_set_header X-Forwarded-For $remote_addr;
      # Event streams must not be held back or cut after a minute of silence.
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
