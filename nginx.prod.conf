worker_processes auto;

events {
  worker_connections 8192;
}

http {
  # Each request goes to the instance with the fewest open requests. Every instance can serve every route: tickets are
  # signed with a shared secret, state lives in Postgres and Redis, and one instance wins each admission tick.
  # An instance that crashed is started again by Docker (restart: unless-stopped) and may come back at a new address, so
  # the names are looked up again through Docker's DNS (`resolve`) instead of once at start.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream flash_be {
    zone flash_be 64k;
    least_conn;
    server flash-be-1:8080 resolve;
    server flash-be-2:8080 resolve;
    server flash-be-3:8080 resolve;
    keepalive 256;
  }

  # The same for both listeners below. Event streams must not be held back or cut after a minute of silence.
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 1h;

  # One id per request, which nginx, flash-web and flash-be all log. flash-be keeps an id only when it is a UUID, and
  # nginx's own $request_id is 32 hex digits, so the dashes of a UUID are put in here.
  map $request_id $request_uuid {
    "~^(?<p1>[0-9a-f]{8})(?<p2>[0-9a-f]{4})(?<p3>[0-9a-f]{4})(?<p4>[0-9a-f]{4})(?<p5>[0-9a-f]{12})$" "$p1-$p2-$p3-$p4-$p5";
  }

  # Each server sets $trace_id: the id it makes (port 80) or the id flash-web sent (port 8081).
  log_format traced '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time request_id=$trace_id';
  access_log /var/log/nginx/access.log traced;

  # The public door, published to the host. Each server sets all its headers, because a server that sets one header
  # inherits none from above.
  server {
    listen 80;
    # A new id for every request. Whatever the caller sent in X-Request-Id is replaced.
    set $trace_id $request_uuid;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The address of the caller as nginx sees it. Whatever the caller sent in X-Forwarded-For is replaced, so a client
    # cannot pick its own address for the rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $trace_id;
    # The caller gets the id back on every reply, nginx's own 502 and 504 included. flash-be echoes the same id; it is
    # hidden so the reply carries one header, not two.
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $trace_id always;

    location / {
      proxy_pass http://flash_be;
    }
  }

  # The door of flash-web only. compose.prod.yaml does not publish this port, so only the containers of the stack reach
  # it. flash-web sets X-Forwarded-For to the address of the browser it serves and drops any the browser sent
  # (apps/flash-web/src/proxy.ts), so it is passed on as sent. Without it, every shopper on the page would share the
  # address of the flash-web container. The request id is flash-web's too: it makes one for each request and drops the
  # browser's, so it is passed on as sent.
  server {
    listen 8081;
    set $trace_id $http_x_request_id;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Request-Id $trace_id;

    location / {
      proxy_pass http://flash_be;
    }
  }
}
