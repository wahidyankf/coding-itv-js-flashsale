worker_processes auto;

events {
  worker_connections 8192;
}

http {
  # Each request goes to the instance with the fewest open requests.
  upstream flash_be {
    least_conn;
    server flash-be-1:8080;
    server flash-be-2:8080;
    server flash-be-3:8080;
    keepalive 256;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://flash_be;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # The shopper's address is chosen by the client in the load test, so it is passed through as sent.
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      # Event streams must not be held back.
      proxy_buffering off;
    }
  }
}
