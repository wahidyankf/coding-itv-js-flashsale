name: flash-load

# The stack the load test runs against: three flash-be instances behind nginx, with their own Postgres and Redis.
# Nothing here is published except nginx on the loopback address. The values are for this test only.
x-api: &api
  image: flash-be:load
  environment: &api-env
    DATABASE_URL: postgres://flash:flash@postgres:5432/flash
    REDIS_URL: redis://redis:6379
    TICKET_SECRET: load-test-ticket-secret
    # Behind nginx, the address of a shopper comes from X-Forwarded-For.
    TRUST_PROXY: "true"
    # The defaults of the product, written down so a run does not depend on them changing.
    PAYMENT_LATENCY_MS: "150"
    PAYMENT_FAILURE_RATE: "0.02"
    RATE_LIMIT_WINDOW_SECONDS: "10"
    RATE_LIMIT_PER_USER: "30"
    RATE_LIMIT_PER_IP: "600"
    SALE_CACHE_MS: "1000"
    ADMISSION_TICK_MS: "1000"
  depends_on:
    flash-be-migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flash
    # Three instances with ten connections each stay far below this.
    command: ["postgres", "-c", "max_connections=200"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    # No snapshots: a restarted Redis comes back empty, which is what the chaos run needs.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  flash-be-migrate:
    build:
      context: ../..
      dockerfile: apps/flash-be/Dockerfile
    image: flash-be:load
    command: ["node", "dist/migrate.js"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  flash-be-1:
    <<: *api
  flash-be-2:
    <<: *api
  flash-be-3:
    <<: *api

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      flash-be-1:
        condition: service_healthy
      flash-be-2:
        condition: service_healthy
      flash-be-3:
        condition: service_healthy

  # k6 runs inside the compose network, so it reaches nginx by name. It starts only when asked for.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["tools"]
    volumes:
      - ./k6:/scripts:ro
      - ../../generated-reports/load:/reports
