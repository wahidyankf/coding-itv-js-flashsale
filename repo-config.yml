# yaml-language-server: $schema=https://github.com/wahidyankf/rhino/releases/download/v0.16.7/rhino-repo-config-v2.schema.json
# RHINO policy for this repo. Only the Markdown checks are declared; RHINO enforces nothing undeclared.

schema: rhino/repo-config/v2

scan:
  exclude-directories:
    - .git
    - node_modules
    - .nx
    - .output
    - dist
    - .serena
    - .tools
    - worktrees
    - local-tmp
    - generated-reports
    # Test output that Playwright and Vitest write, ignored by git.
    - test-results
    - playwright-report
    - coverage
    - .features-gen

policies:
  markdown:
    internal-link:
      exclude-sources: []
    heading-hierarchy:
      surfaces:
        - glob: "**/*.md"
      single-h1: true
      max-level-jump: 1
    # Every folder under docs/ and specs/ has a README that links its direct children.
    readme-index:
      trees:
        - path: docs
          require-direct-children: every-directory
        - path: specs
          require-direct-children: every-directory
    # Diagrams state the accessible title and description, use the palette, and keep labels short.
    mermaid:
      authoring-rule: rendered
      node-label-graphemes: 30
      edge-label-graphemes: 24
      fill-colors:
        ["#0173B2", "#DE8F05", "#029E73", "#CC78BC", "#CA9161", "#808080"]
      edge-colors: ["#0173B2", "#000000"]
      text-colors: ["#000000", "#FFFFFF"]
      require-default-class: true
      forbid-theme-overrides: true
      canvas-colors: ["#FFFFFF", "#0D1117"]
